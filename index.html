function updatePitch(){
  const box = document.getElementById('pitchBox');
  if(!box) return; // this screen (e.g. Pricing) has no Elevator Pitch section
  const checkedAmenities = AMENITIES.filter((a,i)=>cgState.amenitiesChecked[i]);
  const checkedReasons = REASONS_FOR_MOVE.filter((r,i)=>cgState.reasonsChecked[i]);
  const other = (document.getElementById('otherAmenities')?.value || cgState.otherAmenities || '').trim();
  const otherList = other ? other.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const tone = TONES.find(t=>t.id===cgState.activeTone);
  if(checkedAmenities.length===0 && checkedReasons.length===0 && otherList.length===0){
    box.innerHTML = '<span class="pitch-empty">Check off what the prospect mentioned above, and your personalized pitch appears here.</span>';
    return;
  }
  // Reasons first (why they're moving), then amenities (what they want) —
  // reads more naturally as "since X, you'll love Y" than the reverse.
  let lines = [...checkedReasons, ...checkedAmenities].map(a=>PITCH_LINES[a]);
  otherList.forEach(o=>lines.push(`we've got you covered on ${o} too`));
  let pitch = tone.opener + " ";
  if(lines.length===1){ pitch += lines[0].charAt(0).toUpperCase()+lines[0].slice(1)+'.'; }
  else { pitch += lines.slice(0,-1).map(l=>l.charAt(0).toUpperCase()+l.slice(1)).join('. ') + `. ${tone.connector} ${lines[lines.length-1]}.`; }
  if(cgState.pricingPermission==='yes') pitch += " And since this fits right within your budget, I really think this could be the perfect match!";
  pitch += " " + tone.closer;
  box.textContent = pitch;
}
// Joins a list of items into natural prose: "A", "A and B", or "A, B, and C"
function joinNaturally(arr){
  if(arr.length===0) return '';
  if(arr.length===1) return arr[0];
  if(arr.length===2) return arr[0]+' and '+arr[1];
  return arr.slice(0,-1).join(', ')+', and '+arr[arr.length-1];
}

function updateNote(){
  const details = (document.getElementById('detailsBox')?.value || cgState.details || '').trim();
  cgState.details = details;
  const needs = AMENITIES.filter((a,i)=>cgState.amenitiesChecked[i]);
  const other = (document.getElementById('otherAmenities')?.value || cgState.otherAmenities || '').trim();
  if(other) needs.push(other);
  const reasons = REASONS_FOR_MOVE.filter((r,i)=>cgState.reasonsChecked[i]);

  const realtorEntry = cgState.quickAnswersUsed.find(u=>u.scenarioId==='realtor_represented');
  const uniqueTopics = [...new Map(cgState.quickAnswersUsed.filter(u=>u.topicId!=='realtor').map(u=>[u.topicId,u.topicLabel])).values()];
  const usedQualVerbatim = cgState.quickAnswersUsed.some(u=>{
    if(u.topicId==='qualification') return QUALIFICATION_SCENARIOS.find(s=>s.id===u.scenarioId)?.verbatim;
    if(u.topicId==='pets') return PET_POLICY_SCENARIOS.find(s=>s.id===u.scenarioId)?.verbatim;
    return false;
  });
  const qualMarketLabel = cgState.qualMarket ? QUAL_MARKETS.find(m=>m.id===cgState.qualMarket).label : null;

  let story = 'Prospect called in asking about availability.';
  if(realtorEntry){
    story = realtorEntry.realtorClientProvided==='yes' && realtorEntry.realtorClientName.trim()
      ? `Realtor called in on behalf of client "${realtorEntry.realtorClientName.trim()}." Lead kept active as Prospect (realtor-represented) — not changed to Vendor.`
      : `Realtor called in on behalf of a client; client info not provided. Lead kept active as Prospect (realtor-represented) — not changed to Vendor. All follow-ups will go through the realtor.`;
  }
  if(reasons.length) story += ` Reason for the move: ${joinNaturally(reasons)}.`;
  if(uniqueTopics.length) story += ` They also asked about ${joinNaturally(uniqueTopics.map(t=>t.toLowerCase()))}${usedQualVerbatim && qualMarketLabel?` (${qualMarketLabel} market criteria read verbatim)`:''}.`;
  if(needs.length) story += ` They mentioned they're interested in ${joinNaturally(needs)}.`;
  if(cgState.pricingPermission==='yes') story += ' Confirmed their budget aligns with our pricing.';
  else if(cgState.pricingPermission==='no') story += " Budget doesn't currently align with our pricing.";
  if(cgState.hasPet==='yes') story += ' Confirmed they have a pet — discussed Pet Profile and screening fees.';
  else if(cgState.hasPet==='no') story += ' No pet.';
  if(details) story += ` ${details}`;
  if(cgState.actionChecked) story += ' Funnel preference card updated.';

  const hasContent = needs.length || reasons.length || details || cgState.actionChecked || uniqueTopics.length || cgState.pricingPermission || realtorEntry || cgState.hasPet;
  document.getElementById('notePreview').textContent = hasContent ? story : '';
  const itemCount = needs.length + reasons.length + (details?1:0) + (cgState.actionChecked?1:0) + uniqueTopics.length + (cgState.pricingPermission?1:0) + (realtorEntry?1:0) + (cgState.hasPet?1:0);
  document.getElementById('noteCharCount').textContent = itemCount + (itemCount===1?' item':' items');
}

function toCsvUrl(url){
  try{
    const m=url.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
    if(!m)return null;
    const id=m[1];
    const gm=url.match(/[#&?]gid=(\d+)/);
    const gid=gm?gm[1]:'0';
    return`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${gid}`;
  }catch(e){return null;}
}

async function syncSheet(silent){
  if(!state.sheetUrl){
    if(!silent){state.syncMsg='Paste your Google Sheet link first.';state.syncStatus='error';render();}
    return;
  }
  const csvUrl=toCsvUrl(state.sheetUrl);
  if(!csvUrl){
    if(!silent){state.syncMsg='Invalid Google Sheets URL.';state.syncStatus='error';render();}
    return;
  }
  if(!silent){state.syncStatus='loading';state.syncMsg='';render();}

  const proxies = [
    url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
  ];

  let text = null;
  let lastError = '';

  for (let i = 0; i < proxies.length; i++) {
    try {
      const proxyUrl = proxies[i](csvUrl);
      const res = await fetch(proxyUrl, { cache: 'no-store' });
      if (!res.ok) { lastError = `Proxy ${i+1} returned ${res.status}`; continue; }
      const raw = await res.text();
      if (raw.trim().startsWith('{') && raw.includes('"contents"')) {
        try {
          const json = JSON.parse(raw);
          text = json.contents || '';
        } catch(e) { text = raw; }
      } else {
        text = raw;
      }
      const t = (text || '').trim();
      const looksLikeRealCsv = t.length > 10
        && !t.startsWith('<')
        && t.toLowerCase() !== 'null'
        && !t.toLowerCase().startsWith('window.location')
        && !t.toLowerCase().includes('accounts.google.com')
        && t.includes(',');
      if (looksLikeRealCsv) break;
      lastError = `Proxy ${i+1} returned invalid content (not real CSV data)`;
      text = null;
    } catch(err) {
      lastError = `Proxy ${i+1} failed: ${err.message}`;
    }
  }

  if (!text) {
    if(!silent){
      state.syncStatus='error';
      state.syncMsg=`Could not reach the sheet right now (${lastError||'all proxy services failed'}). This is usually a temporary outage with the free proxy service, not a problem with your sheet. Try again in a minute, or use the manual entry tabs in the meantime.`;
      render();
    } else {
      state.lastAutoSyncError = lastError || 'All proxies failed';
    }
    return;
  }

  try{
    const lines=text.split('\n').filter(l=>l.trim());
    if(lines.length<1)throw new Error('Sheet appears empty.');

    const firstRowCols = lines[0].split(',').map(c=>c.trim().toLowerCase().replace(/"/g,''));
    const looksLikeHeader = firstRowCols.some(c=>c==='kpi'||c==='metric') && firstRowCols.some(c=>c==='score'||c==='actual'||c==='value');

    let ki, si, dataLines;
    if (looksLikeHeader) {
      ki = firstRowCols.findIndex(h=>h.includes('kpi')||h.includes('metric')||h.includes('name'));
      si = firstRowCols.findIndex(h=>h.includes('score')||h.includes('actual')||h.includes('value'));
      dataLines = lines.slice(1);
    } else {
      ki = 0;
      si = 1;
      dataLines = lines;
    }

    const u={...state.teamScores};
    let matchedAny=false;
    dataLines.forEach(line=>{
      const cols=line.split(',').map(c=>c.trim().replace(/"/g,''));
      const n=(cols[ki]||'').toLowerCase();
      if(!n)return;
      const v=parseFloat((cols[si]||'').replace('%',''))||0;
      if(n.includes('call')&&n.includes('completion')){u.call_completion=v;matchedAny=true;}
      else if(n.includes('lead engagement')||n.includes('lead eng')){u.lead_engagement=v;matchedAny=true;}
      else if(n.includes('task management')||n.includes('task')){u.task_management=v;matchedAny=true;}
      else if(n.includes('lead to scheduled')||n.includes('scheduled tour')){u.lead_to_scheduled=v;matchedAny=true;}
      else if(n.includes('lead to tour')&&!n.includes('scheduled')){u.lead_to_tour=v;matchedAny=true;}
    });

    if(!matchedAny)throw new Error('Could not find any matching KPI rows. Check that column A has KPI names like "Call Completion Rate" and column B has the scores.');

    state.teamScores=u;
    state.lastAutoSyncError = null;
    state.lastSynced=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    if(!silent){
      state.syncStatus='success';state.syncMsg='Scores synced!';
      setTimeout(()=>{state.syncStatus='idle';state.syncMsg='';render();},5000);
    }
  }catch(err){
    if(!silent){
      state.syncStatus='error';
      state.syncMsg=err.message||'Could not parse sheet data.';
    } else {
      state.lastAutoSyncError = err.message||'Could not parse sheet data.';
    }
  }
  render();
}
function handleFenixUpload(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const lines=ev.target.result.split('\n').filter(l=>l.trim());
      if(lines.length<2){state.fenixMsg='File appears empty.';render();return;}
      const h=lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/"/g,''));
      const ni=h.findIndex(x=>x.includes('agent')||x.includes('name'));
      const si=h.findIndex(x=>x.includes('score')||x.includes('percent')||x.includes('%'));
      if(ni===-1||si===-1){state.fenixMsg='CSV needs: Agent Name, Score.';render();return;}
      const parsed=lines.slice(1).map(l=>{
        const c=l.split(',').map(x=>x.trim().replace(/"/g,''));
        const scoreRaw = c[si]||'';
        let score = parseFloat(scoreRaw.replace('%',''))||0;
        if(score > 0 && score <= 1) score = Math.round(score * 1000) / 10;
        return{name:c[ni]||'',fenix:score};
      }).filter(a=>a.name && a.fenix > 0);
      state.agents=state.agents.map(a=>{const m=parsed.find(p=>p.name.toLowerCase()===a.name.toLowerCase());return m?{...a,fenix_scored_calls:m.fenix}:a;});
      const teamAvg = parsed.length > 0 ? Math.round(Math.max(...parsed.map(a=>a.fenix))*10)/10 : 0;
      state.teamScores.fenix_scored_calls = teamAvg;
      state.fenixMsg=`✓ ${parsed.length} agents loaded`;
      setTimeout(()=>{state.fenixMsg='';render();},5000);
    }catch(e){state.fenixMsg='Could not read file.';}
    render();
  };
  reader.readAsText(file);
}

function copySpielTemplate(id, btn){
  const spiel = INCOME_VERIFICATION_SPIELS.find(s=>s.id===id);
  if(!spiel) return;
  navigator.clipboard.writeText(spiel.template).then(()=>{
    if(btn){

      btn.textContent = '✓ Copied!';
      setTimeout(()=>{ btn.textContent = original; }, 1500);

function finalizeChecklist(){
  const lines=[];
  CHECKLIST_SECTIONS.forEach(sec=>{
    const revisionLine = (sec.hasRevisionToggle && state.checklistRevision)
      ? [state.checklistRevision==='with' ? 'With Revision' : 'Without Revision']
      : [];
    const itemLines = [];
    sec.items.forEach((item,i)=>{
      if(item.type==='branch'){
        const selected = state.checklistBranchSelected[item.id];
        if(!selected) return;
        itemLines.push(`${item.text}: ${selected}`);
        const subChecks = (item.subChecksByOption && item.subChecksByOption[selected]) || [];
        subChecks.forEach((sub,si)=>{
          const subId = item.id+'_'+si;
          if(state.checklistSubChecked[subId]) itemLines.push('   ✅ '+sub);
        });
      } else {
        if(state.checklistChecked[sec.key+i]) itemLines.push('✅ '+item.text);
      }
    });
    const allLines = [...revisionLine, ...itemLines];
    if(allLines.length){
      lines.push(sec.title+':');
      allLines.forEach(item=>lines.push('- '+item));
      lines.push('');
    }
  });
  if(!lines.length){
    state.checklistCopyMsg='Nothing checked yet — check off the items you completed first.';
    render();
    return;
  }
  const text = lines.join('\n').trim();
  const done = ()=>{
    state.checklistCopyMsg='✓ Copied to clipboard. Checklist cleared for the next file.';
    state.checklistChecked={};
    state.checklistRevision='';
    state.checklistBranchSelected={};
    state.checklistSubChecked={};
    render();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      state.checklistCopyMsg='Could not copy automatically — please copy manually.';
      render();
    });
  }else{
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ state.checklistCopyMsg='Could not copy automatically — please copy manually.'; render(); }
    document.body.removeChild(ta);
  }
}

async function saveApplicantList(){
  const saved = await saveToFirestore('applicant_tracker', {items: state.applicantEntries});

    flagSaveFailed('Applicant Status entry');
  } else if(state.syncError){

function resetApplicantForm(){

  state.apBlocker=''; state.apTrackingStatus='inprogress';
  state.showApplicantForm=false; state.editingApplicantId=null;

async function saveApplicantEntry(){
  if(!state.apName.trim()||!state.apProperty){ alert('Please fill in the applicant name and select a property.'); return; }
  const visitorName = getVisitorName() || 'Team';
  if(state.editingApplicantId){
    const entry = state.applicantEntries.find(e=>e.id===state.editingApplicantId);
    if(entry){
      Object.assign(entry, {
        name:state.apName.trim(), property:state.apProperty, unitNumber:state.apUnitNumber.trim(), status:state.apStatus,
        moveIn:state.apMoveIn, guestcardUrl:state.apGuestcardUrl.trim(), applicationUrl:state.apApplicationUrl.trim(),
        blocker:state.apBlocker.trim(), trackingStatus:state.apTrackingStatus,
        updatedBy:visitorName, updatedAt:new Date().toISOString().split('T')[0],
      });
    }
  } else {
    state.applicantEntries.unshift({
      id:Date.now(), name:state.apName.trim(), property:state.apProperty, unitNumber:state.apUnitNumber.trim(), status:state.apStatus,
      moveIn:state.apMoveIn, guestcardUrl:state.apGuestcardUrl.trim(), applicationUrl:state.apApplicationUrl.trim(),
      blocker:state.apBlocker.trim(), trackingStatus:'inprogress',
      addedBy:visitorName, addedAt:new Date().toISOString().split('T')[0],
    });
  }
  resetApplicantForm();
  render();
  await saveApplicantList();
}
function editApplicantEntry(id){
  const entry = state.applicantEntries.find(e=>e.id===id);
  if(!entry) return;
  state.apName=entry.name; state.apProperty=entry.property||''; state.apUnitNumber=entry.unitNumber||''; state.apStatus=entry.status;
  state.apMoveIn=entry.moveIn||''; state.apGuestcardUrl=entry.guestcardUrl||''; state.apApplicationUrl=entry.applicationUrl||'';
  state.apBlocker=entry.blocker||''; state.apTrackingStatus=entry.trackingStatus;
  state.editingApplicantId=id; state.showApplicantForm=true;
  render();
}

        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px">
            <span style="font-size:14px;font-weight:700;color:#0f172a">${entry.name}</span>
            <span style="font-size:10px;font-weight:700;background:${st.bg};color:${st.color};padding:2px 8px;border-radius:20px">${entry.status}</span>
            ${isComplete?`<span style="font-size:10px;font-weight:700;background:#f1f5f9;color:#64748b;padding:2px 8px;border-radius:20px">✓ Complete</span>`:''}
          </div>
          <div style="font-size:12px;color:#64748b;margin-bottom:6px">${entry.property||''}${entry.unitNumber?` - ${entry.unitNumber}`:''}${entry.moveIn?` · Move-in ${new Date(entry.moveIn+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`:''}</div>
          ${(entry.guestcardUrl||entry.applicationUrl)?`
            <div style="display:flex;gap:12px;margin-bottom:6px">
              ${entry.guestcardUrl?`<a href="${entry.guestcardUrl}" target="_blank" rel="noopener" style="font-size:11px;font-weight:700;color:#4f46e5;text-decoration:none">🔗 View Guestcard</a>`:''}
              ${entry.applicationUrl?`<a href="${entry.applicationUrl}" target="_blank" rel="noopener" style="font-size:11px;font-weight:700;color:#4f46e5;text-decoration:none">🔗 View Application</a>`:''}
            </div>`:''
          }
          ${entry.blocker?`
            <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px 10px;margin-top:6px">
              <div style="font-size:10px;font-weight:700;color:#92400e;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px">Why the lease hasn't gone out yet</div>
              <div style="font-size:12px;color:#78350f;line-height:1.5">${entry.blocker}</div>
            </div>`:''
          }
          <div style="font-size:10.5px;color:#94a3b8;margin-top:7px">Added by ${entry.addedBy} · ${entry.addedAt}${entry.updatedBy?` · Updated by ${entry.updatedBy} on ${entry.updatedAt}`:''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          <button onclick="toggleApplicantComplete(${entry.id})" style="font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:7px;border:1px solid ${isComplete?'#e2e8f0':'#bbf7d0'};background:${isComplete?'#fff':'#f0fdf4'};color:${isComplete?'#64748b':'#15803d'};cursor:pointer;white-space:nowrap">${isComplete?'↺ Reopen':'✓ Complete'}</button>
          <button onclick="editApplicantEntry(${entry.id})" style="font-size:10.5px;color:#3b82f6;background:none;border:none;cursor:pointer;padding:0">Edit</button>
          <button onclick="deleteApplicantEntry(${entry.id})" style="font-size:10.5px;color:#dc2626;background:none;border:none;cursor:pointer;padding:0">Remove</button>
        </div>
      </div>
    </div>`;
}
function renderApplicantStatus(){
  const active = state.applicantEntries.filter(e=>e.trackingStatus!=='complete');
  const completed = state.applicantEntries.filter(e=>e.trackingStatus==='complete');
  const counts = {};
  APPLICANT_STATUS_OPTIONS.forEach(s=>counts[s.label]=0);
  active.forEach(e=>{ if(counts[e.status]!==undefined) counts[e.status]++; });

  return`
    <div class="page-header" style="background:linear-gradient(135deg,#312e81 0%,#4f46e5 100%)">
      <div class="page-header-inner"><span style="font-size:22px">🗂️</span><h1>Applicant Status</h1></div>
      <p>Ready to Send, but the lease hasn't gone out yet — log why, and it'll roll into your daily EOD report</p>
    </div>
    <div class="content" style="padding:20px 24px">

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px">
        <div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px">
          <div style="font-size:18px;font-weight:800;color:#7c3aed">${active.length}</div>
          <div style="font-size:10px;color:#64748b;line-height:1.3;margin-top:2px">Ready to Send — still waiting</div>
        </div>
        <div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:10px;padding:10px 12px">
          <div style="font-size:18px;font-weight:800;color:#15803d">${completed.length}</div>
          <div style="font-size:10px;color:#64748b;line-height:1.3;margin-top:2px">Resolved / Lease Sent</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:12.5px;color:#475569">POC for the day: log new applicants here and update them as they move through the pipeline.</div>
        ${!state.showApplicantForm?`<button onclick="state.showApplicantForm=true;render()" style="flex-shrink:0;padding:8px 16px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">+ Add Applicant</button>`:''}
      </div>

      ${state.showApplicantForm?`
        <div style="background:#fff;border:1.5px solid #4f46e5;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 0 0 3px rgba(79,70,229,.08)">
          <div style="font-size:14px;font-weight:800;color:#0f172a;margin-bottom:14px">${state.editingApplicantId?'✏️ Edit Applicant':'🗂️ New Applicant'}</div>
          <div class="eod-grid">
            <div>
              <label class="eod-label">Applicant Name *</label>
              <input type="text" class="eod-input" placeholder="e.g. Nicole Green" value="${state.apName}" oninput="state.apName=this.value"/>
            </div>
            <div>
              <label class="eod-label">Unit Number</label>
              <input type="text" class="eod-input" placeholder="e.g. 1307, 2 BR" value="${state.apUnitNumber}" oninput="state.apUnitNumber=this.value"/>
            </div>
          </div>
          <div class="eod-grid">
            <div>
              <label class="eod-label">Property *</label>
              <select class="eod-select" style="margin-bottom:0" onchange="state.apProperty=this.value">
                <option value="" ${!state.apProperty?'selected':''} disabled>Select a property</option>
                ${PROPERTIES.map(p=>`<option value="${p}" ${state.apProperty===p?'selected':''}>${p}</option>`).join('')}
              </select>
            </div>
            <div>
              <label class="eod-label">Move-In Date</label>
              <input type="date" class="eod-input" style="margin-bottom:0" value="${state.apMoveIn}" onchange="state.apMoveIn=this.value"/>
            </div>
          </div>
          <div class="eod-grid">
            <div>
              <label class="eod-label">Guestcard Link</label>
              <input type="url" class="eod-input" style="margin-bottom:0" placeholder="https://..." value="${state.apGuestcardUrl}" oninput="state.apGuestcardUrl=this.value"/>
            </div>
            <div>
              <label class="eod-label">Application Link</label>
              <input type="url" class="eod-input" style="margin-bottom:0" placeholder="https://..." value="${state.apApplicationUrl}" oninput="state.apApplicationUrl=this.value"/>
            </div>
          </div>
          <label class="eod-label" style="margin-top:14px">Application Status</label>
          <div style="display:inline-block;background:#ede9fe;color:#7c3aed;font-size:12px;font-weight:700;padding:7px 14px;border-radius:8px;margin-bottom:10px">🗂️ Ready to Send</div>
          <label class="eod-label">Why hasn't the lease been sent yet?</label>
          <textarea class="eod-textarea" placeholder="e.g. Waiting on guarantor to complete income verification" oninput="state.apBlocker=this.value">${state.apBlocker}</textarea>
          <div style="display:flex;gap:8px;margin-top:4px">
            <button onclick="saveApplicantEntry()" style="padding:10px 20px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">${state.editingApplicantId?'Save Changes':'Add to Tracker'}</button>
            <button onclick="resetApplicantForm();render()" style="padding:10px 20px;background:#fff;color:#64748b;border:1px solid #e2e8f0;border-radius:8px;font-size:13px;cursor:pointer">Cancel</button>
          </div>
        </div>`:''
      }

      ${active.length===0?`<div style="text-align:center;padding:24px;color:#64748b;font-size:13px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin-bottom:16px">No applicants being tracked right now.</div>`:
        active.map(renderApplicantCard).join('')
      }

      ${completed.length?`
        <div style="margin-top:20px">
          <div style="font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px">✓ Completed (${completed.length})</div>
          ${completed.map(renderApplicantCard).join('')}
        </div>`:''
      }
    </div>`;
}

// ── DATE RESOLUTION — always against today's ACTUAL date, US local time ──
function rbResolveDates(today){
  today = today || new Date();
  const y = today.getFullYear(), m = today.getMonth(), d = today.getDate();
  const disp = (dt) => dt.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});

  let from, to, label;
  switch(rbState.preset){
    case 'today':
      from = new Date(y,m,d); to = new Date(y,m,d);
      label = disp(from);
      break;
    case 'prevweek': {
      // Previous full Sun–Sat week before the current one
      const dow = today.getDay(); // 0=Sun
      const thisWeekStart = new Date(y,m,d-dow);
      to = new Date(thisWeekStart); to.setDate(to.getDate()-1); // last Saturday
      from = new Date(to); from.setDate(from.getDate()-6); // the Sunday before that
      label = `${disp(from)} to ${disp(to)}`;
      break;
    }
    case 'prevmonth': {
      from = new Date(y, m-1, 1);
      to = new Date(y, m, 0); // day 0 of this month = last day of prev month
      label = `${from.toLocaleDateString('en-US',{month:'long',year:'numeric'})} (${disp(from)} to ${disp(to)})`;
      break;
    }
    case 'prevqtr': {
      const q = Math.floor(m/3); // current quarter 0-3
      const prevQStartMonth = ((q-1+4)%4) * 3;
      const prevQYear = q===0 ? y-1 : y;
      from = new Date(prevQYear, prevQStartMonth, 1);
      to = new Date(prevQYear, prevQStartMonth+3, 0);
      label = `Q${((q-1+4)%4)+1} ${prevQYear} (${disp(from)} to ${disp(to)})`;
      break;
    }
    case 'mtd':
      from = new Date(y,m,1); to = new Date(y,m,d);
      label = `Month to date (${disp(from)} to ${disp(to)})`;
      break;
    case 'qtd': {
      const q = Math.floor(m/3);
      from = new Date(y, q*3, 1); to = new Date(y,m,d);
      label = `Q${q+1} ${y} (${disp(from)} to ${disp(to)})`;
      break;
    }
    case 'ytd':
      from = new Date(y,0,1); to = new Date(y,m,d);
      label = `Year to date (${disp(from)} to ${disp(to)})`;
      break;
    case 'custom':
      from = rbState.from ? new Date(rbState.from+'T00:00:00') : null;
      to = rbState.to ? new Date(rbState.to+'T00:00:00') : null;
      label = (from && to) ? `${disp(from)} to ${disp(to)}` : 'Custom range — pick both dates';
      break;
  }
  return {from, to, label};
}

// ── SCOPE RESOLUTION ─────────────────────────────────────────────
function rbAllCommunities(){
  const all = [];
  for(const key in cmMarketsData) all.push.apply(all, cmMarketsData[key].communities);
  return all;
}
function rbScopeCommunities(){
  if(rbState.scopeType==='community'){
    const c = rbAllCommunities().find(c=>c.id===rbState.community);
    return c ? [c] : [];
  }
  if(rbState.scopeType==='market'){
    return (rbState.market && cmMarketsData[rbState.market]) ? cmMarketsData[rbState.market].communities : [];
  }
  if(rbState.scopeType==='ecosystem'){
    return rbAllCommunities().filter(c => rbEcosystem(c.id) === rbState.eco);
  }
  return rbAllCommunities(); // portfolio
}
function rbScopeLabel(){
  if(rbState.scopeType==='community'){
    const c = rbAllCommunities().find(c=>c.id===rbState.community);
    return c ? c.name : 'Select a community';
  }
  if(rbState.scopeType==='market') return rbState.market ? cmMarketsData[rbState.market].label : 'Select a market';
  if(rbState.scopeType==='ecosystem'){
    const n = rbScopeCommunities().length;
    return (rbState.eco==='pilot' ? 'Denver Pilot Funnel' : 'Original Funnel') + ` (all ${n} communities)`;
  }
  return `Entire portfolio (${rbAllCommunities().length} communities)`;
}
function rbEcosystemsInScope(){
  const ecos = new Set(rbScopeCommunities().map(c=>rbEcosystem(c.id)));
  return [...ecos];
}
function rbTeamFilter(){
  if(rbState.scopeType==='portfolio' || rbState.scopeType==='ecosystem'){
    return `Leave the Team filter empty — this scope already pulls everything in ${rbScopeLabel()}.`;
  }
  const names = rbScopeCommunities().map(c=>c.name);
  if(!names.length) return 'Pick a community or market above first.';
  return `Select: ${names.join(', ')}`;
}
function rbSnapshotStatuses(){
  const ecos = rbEcosystemsInScope();
  const hasPilot = ecos.includes('pilot');
  return hasPilot ? 'Prospect, Did Not Rent, Applicant' : 'Prospect, Did Not Rent';
}

// ── AGENT SCRIPT ─────────────────────────────────────────────────
// The Hub cannot pull the files itself: a static page can't drive another
// site's session or write to disk — browsers block that by design. Claude
// in Chrome can, because it's a browser agent using your real logins. So
// the Run button assembles a click-by-click execution script the agent
// runs end to end, ending with a sentinel line so a truncated hand-off
// can never pass silently as a complete one.
function rbAgentScript(){
  const p = rbResolveDates();
  const communities = rbScopeCommunities();
  const picked = RB_REPORTS.filter(r=>rbState.picked[r.id]);
  const fmt = RB_FORMATS.find(f=>f.id===rbState.format);
  const L = [];
  let n = 0;
  const step = (t) => { n++; L.push(n+'. '+t); };

  L.push('RUN THE PEC REPORT — '+rbScopeLabel()+' — '+p.label);
  L.push('');
  L.push('You are pulling Funnel reports in the browser, then writing the report.');
  L.push('Use Claude in Chrome. I am already logged in. Do not ask me to log in again.');
  L.push('If you hit a login screen or a CAPTCHA, stop and tell me instead of guessing.');
  L.push('');
  L.push('PERIOD: '+p.label);
  L.push('Set every date filter to this exact range. Do not use the preset names,');
  L.push('they resolve differently depending on the day.');
  L.push('');

  const pilotComms = communities.filter(c=>rbEcosystem(c.id)==='pilot');
  const origComms = communities.filter(c=>rbEcosystem(c.id)==='original');
  const ecoGroups = [];
  if(origComms.length) ecoGroups.push({key:'original', label:'Original Funnel', comms:origComms});
  if(pilotComms.length) ecoGroups.push({key:'pilot', label:'Denver Pilot Funnel', comms:pilotComms});
  const spansBoth = ecoGroups.length > 1;

  if(spansBoth){
    L.push('⚠️ THIS RUN SPANS BOTH FUNNELS. They are separate systems in separate');
    L.push('Chrome profiles. Finish one completely, then switch profiles and do the other.');
    L.push('');
  }

  L.push('=== PART 1: DOWNLOAD ===');
  L.push('');

  if(!picked.length){
    L.push('(No reports picked yet — go back and check at least one in Report Set.)');
    L.push('');
  }

  ecoGroups.forEach(e=>{
    const relevant = picked.filter(r=>{
      if(r.external) return e.key === ecoGroups[0].key;
      if(!(r.splitPath || r.snapshot)) return e.key === ecoGroups[0].key;
      return true;
    });
    if(!relevant.length) return;
    if(spansBoth){
      L.push('--- '+e.label+' ('+e.comms.length+' communities) ---');
      L.push('Switch to the Chrome profile signed into this Funnel first.');
      L.push('');
    }
    relevant.forEach(r=>{
      const path = (r.splitPath && e.key==='pilot') ? r.pilotPath : r.path;
      step(`Go to ${r.external ? r.path : path}.`);
      if(r.extra) r.extra.forEach(x => L.push('   Filter: '+x));
      if(!r.external){
        const teamNote = (rbState.scopeType==='portfolio' || rbState.scopeType==='ecosystem')
          ? 'leave the Team filter empty (already scoped)'
          : 'Team filter → ' + e.comms.map(c=>c.name).join(', ');
        L.push('   '+teamNote+'.');
      }
      if(r.snapshot) L.push('   Snapshot Status: '+rbSnapshotStatuses());
      if(r.note) L.push('   Note: '+r.note);
      L.push('   '+r.download+'.');
      L.push('');
    });
  });

  L.push('=== PART 2: ANALYZE & DRAFT ===');
  L.push('');
  step(`Once every file above is downloaded, analyze them together for the period ${p.label}.`);
  step(`Build the report in ${fmt.label} format: ${fmt.desc}`);
  if(spansBoth){
    step('Since this run spans both Funnel ecosystems, state that methodology explicitly — Applicant-inclusive Snapshot Status only applies to the Pilot portion, so combined rates mix two populations.');
  }
  step('Name which reports were pulled and the exact resolved date range in the final output.');
  L.push('');
  L.push('END OF RUN SCRIPT');

  return L.join('\n');
}

// Deep link into Claude Desktop with the script prefilled. Anthropic
// documents claude://claude.ai/new?q=... — the app launches if it isn't
// running, and the prompt lands in the composer for review rather than
// auto-sending. We always copy to the clipboard first, because custom
// protocol URLs have length limits that vary by OS, and a truncated run
// script handed to an agent is worse than no run script at all.
const RB_URL_SAFE = 7000;
function rbRunUrl(){ return 'claude://claude.ai/new?q=' + encodeURIComponent(rbAgentScript()); }
function rbUrlTooLong(){ return rbRunUrl().length > RB_URL_SAFE; }
function rbFlash(id, msg, ms){
  const b = document.getElementById(id);
  if(!b) return;
  const o = b.innerHTML;
  b.innerHTML = msg;
  setTimeout(()=>{ b.innerHTML = o; }, ms || 2600);
}

// Persistent module-level state — survives incidental re-renders of the page
// (e.g. Firestore hydration finishing while someone's browsing this tab)
// without resetting their selected market or home community.
let cmState = { currentMarket: null, homeId: null, driveCache: {} };
let cmMapInstance = null;
let cmMarkers = {};
let cmLines = [];
let cmSearchText = '';
let cmMatrixShown = false;

function cmHaversineMiles(a,b){
  const R = 3958.8;
  const toRad = d => d*Math.PI/180;
  const dLat = toRad(b.lat-a.lat);
  const dLng = toRad(b.lng-a.lng);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}
function cmPinIcon(color, big){
  return L.divIcon({
    className:'',
    html:`<div style="width:${big?26:18}px;height:${big?26:18}px;border-radius:50% 50% 50% 0;background:${color};transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.25);border:2px solid #fff;"></div>`,
    iconSize:[big?26:18,big?26:18],
    iconAnchor:[big?13:9,big?26:18]
  });
}
function cmCommunities(){ return cmMarketsData[cmState.currentMarket].communities; }
function cmHomeCommunity(){
  const list = cmCommunities();
  return list.find(c=>c.id===cmState.homeId) || list[0];
}
function cmEstimateDrive(straightMiles){
  const roadMiles = straightMiles * 1.25;
  let mph;
  if(roadMiles < 5) mph = 25;
  else if(roadMiles < 15) mph = 35;
  else if(roadMiles < 40) mph = 45;
  else mph = 58;
  return { miles: roadMiles, mins: (roadMiles / mph) * 60, estimated: true };
}
function cmFetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  return fetch(url, { signal: controller.signal }).finally(()=>clearTimeout(timer));
}
let cmActiveFetches = 0;
const CM_MAX_CONCURRENT = 3;
const cmFetchQueue = [];
function cmRunQueue(){
  while(cmActiveFetches < CM_MAX_CONCURRENT && cmFetchQueue.length){
    const job = cmFetchQueue.shift();
    cmActiveFetches++;
    job().finally(()=>{ cmActiveFetches--; cmRunQueue(); });
  }
}
function cmEnqueue(fn){
  return new Promise((resolve)=>{
    cmFetchQueue.push(()=>fn().then(resolve).catch(()=>resolve(null)));
    cmRunQueue();
  });
}
async function cmFetchDrive(a,b, attempt){
  attempt = attempt || 1;
  const key = a.id+'->'+b.id;
  if(cmState.driveCache[key]) return cmState.driveCache[key];
  const straightMiles = cmHaversineMiles(a,b);
  const result = await cmEnqueue(async ()=>{
    try{
      const url = `https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=false`;
      const res = await cmFetchWithTimeout(url, 6000);
      const data = await res.json();
      if(data.routes && data.routes[0]){
        const miles = data.routes[0].distance / 1609.34;
        const mins = data.routes[0].duration / 60;
        return { miles, mins, estimated:false };
      }
      throw new Error('no route');
    }catch(e){
      if(attempt < 2){
        await new Promise(r=>setTimeout(r, 400));
        return cmFetchDrive(a,b,attempt+1);
      }
      return cmEstimateDrive(straightMiles);
    }
  });
  const final = result || cmEstimateDrive(straightMiles);
  cmState.driveCache[key] = final;
  return final;
}
function cmFmtMiles(m){ return m.toFixed(1)+' mi'; }
function cmFmtMins(m){ return Math.round(m)+' min'; }
function cmClearLines(){ cmLines.forEach(l=>cmMapInstance.removeLayer(l)); cmLines = []; }
function cmDrawLines(){
  cmClearLines();
  const home = cmHomeCommunity();
  cmCommunities().forEach(c=>{
    if(c.id===home.id) return;
    const line = L.polyline([[home.lat,home.lng],[c.lat,c.lng]], { color:'#3b82f6', weight:1.5, opacity:0.35, dashArray:'4,6' }).addTo(cmMapInstance);
    cmLines.push(line);
  });
}
function cmFitMapToMarkers(){
  const list = cmCommunities();
  if(list.length === 0) return;
  const bounds = L.latLngBounds(list.map(c=>[c.lat,c.lng]));
  cmMapInstance.fitBounds(bounds, { padding:[40,40] });
}

    marker.bindPopup(popupHtml);
    marker.on('click', () => {
      if(!isHome){
        cmFetchDrive(home,c).then(d=>{

function renderAgentTable(kpiId,goal,unit,agentsList){
  const sourceAgents = agentsList || state.agents;
  const sorted=[...sourceAgents].sort((a,b)=>(b[kpiId]||0)-(a[kpiId]||0));
  return`<div class="section-label" style="margin:12px 0 8px">Per Agent</div>
    <div class="agent-table">
      <div class="agent-table-header"><span>Agent</span><span style="text-align:right">Score</span><span style="text-align:right">Status</span></div>
      ${sorted.map((a,i)=>{
        const s=a[kpiId]||0;const og=s>=goal&&s>0;
        const ini=a.name.split(' ').map(n=>n[0]).join('').slice(0,2);
        return`<div class="agent-row" style="background:${i%2===0?'#fff':'#fafafa'}">

async function addNewPeriod(tab){
  if(!state.newPeriodLabel||!state.newPeriodLabel.trim()){alert('Please enter a label.');return;}
  const history = tab==='monthend' ? state.monthendHistory : state.quarterlyHistory;
  const newId = history.length ? Math.max(...history.map(p=>p.id))+1 : 1;
  const baseKpis = KPI_CONFIG.map(k=>({label:k.label,actual:0,goal:k.goal,unit:k.unit}));
  // Month-End also tracks the separate PEC report stream, prefixed so it's
  // clearly distinguished from the original KPIs above it in the same list.
  const pecKpis = tab==='monthend'
    ? PEC_KPI_CONFIG.map(k=>({label:`PEC — ${k.group?k.group+': ':''}${k.label}`,actual:0,goal:k.goal,unit:k.unit}))
    : [];
  history.push({
    id:newId,
    label:state.newPeriodLabel.trim(),
    kpis:[...baseKpis, ...pecKpis],
  });
  state.newPeriodLabel='';
  state.showAddPeriodForm=false;
  state.expandedPeriod=newId;
  render();
  await savePeriodHistory();
}

async function deletePeriod(tab,periodId){
  if(!confirm('Delete this period entirely? This cannot be undone.'))return;
  if(tab==='monthend'){
    state.monthendHistory = state.monthendHistory.filter(p=>p.id!==periodId);
  } else {
    state.quarterlyHistory = state.quarterlyHistory.filter(p=>p.id!==periodId);
  }
  if(state.expandedPeriod===periodId) state.expandedPeriod=null;
  render();
  await savePeriodHistory();
}

async function savePeriodMetric(tab,periodId,kpiIdx){
  const history = tab==='monthend' ? state.monthendHistory : state.quarterlyHistory;
  const period = history.find(p=>p.id===periodId);
  if(!period)return;
  const editKey = `${periodId}_${kpiIdx}`;
  const actual = parseFloat(document.getElementById('pa_'+editKey).value)||0;
  const goal   = parseFloat(document.getElementById('pg_'+editKey).value)||0;
  period.kpis[kpiIdx] = {...period.kpis[kpiIdx], actual, goal};
  state.editingPeriodMetric=null;
  render();
  await savePeriodHistory();
}

async function saveCoachingLog(){
  if(!state.clCoachee){alert('Please select a coachee.');return;}
  if(!state.clDate){alert('Please select a date.');return;}
  if(!state.clCategory){alert('Please select a category.');return;}
  if(!state.clNotes||!state.clNotes.trim()){alert('Please add coaching notes.');return;}
  if(state.clFileName&&state.clFileName.trim()&&(!state.clDriveUrl||!state.clDriveUrl.trim())){
    alert("You named an attachment but didn't paste a Drive link — add the link so others can actually open it, or clear the attachment name.");
    return;
  }
  const newLog={
    id:Date.now(),
    coachee:state.clCoachee,
    date:state.clDate,
    category:state.clCategory,
    notes:state.clNotes.trim(),
    fileName:state.clFileName||'',
    driveUrl:state.clDriveUrl||'',
  };
  coachingLogs.push(newLog);
  state.showCoachingForm=false;
  state.clCoachee='';state.clDate='';state.clCategory='';state.clNotes='';state.clFileName='';state.clDriveUrl='';
  render();
  await saveCoachingLogs();
}

async function deleteCoachingLog(id){
  if(!confirm('Delete this coaching log?'))return;
  coachingLogs=coachingLogs.filter(l=>l.id!==id);
  state.expandedCoaching=null;
  render();
  await saveCoachingLogs();
}

function copyTextBlock(id, btnEl){
  const el = document.getElementById(id);
  if(!el) return;
  const text = el.innerText;
  const done = ()=>{
    const original = btnEl.textContent;
    btnEl.textContent = '✓ Copied';
    setTimeout(()=>{ btnEl.textContent = original; }, 1800);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>alert('Could not copy automatically — please select and copy manually.'));
  } else {
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); } catch(e){ alert('Could not copy automatically — please select and copy manually.'); }
    document.body.removeChild(ta);
  }
}
function setOfferLetterMethod(method){
  state.olMethod = method;
  render();
}
function toggleOfferConfirmed(field){
  state[field] = !state[field];
  render();
}
function resetOfferLetterNote(){
  state.olApplicantName=''; state.olMethod='phone'; state.olContactName=''; state.olCompanyName='';
  state.olDate=''; state.olConfirmedStart=false; state.olConfirmedPosition=false;
  state.olConfirmedComp=false; state.olConfirmedHours=false; state.olNotes=''; state.olCopyMsg='';
  render();
}
function copyOfferLetterNote(){
  if(!state.olApplicantName.trim()){
    state.olCopyMsg='Add the applicant\'s name first.';
    render();
    return;
  }
  const confirmedItems = [];
  if(state.olConfirmedStart) confirmedItems.push('Start date');
  if(state.olConfirmedPosition) confirmedItems.push('Position/title');
  if(state.olConfirmedComp) confirmedItems.push('Compensation (salary/hourly rate)');
  if(state.olConfirmedHours) confirmedItems.push('Expected hours (if hourly)');

  const lines = [];
  lines.push(`Offer Letter Verification — ${state.olApplicantName.trim()}`);
  lines.push(`Verified via: ${state.olMethod==='phone'?'Phone call':'Email'}`);
  if(state.olContactName.trim()) lines.push(`Spoken with: ${state.olContactName.trim()}${state.olCompanyName.trim()?` (${state.olCompanyName.trim()})`:''}`);
  else if(state.olCompanyName.trim()) lines.push(`Employer: ${state.olCompanyName.trim()}`);
  if(state.olDate) lines.push(`Date verified: ${new Date(state.olDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`);
  lines.push('');
  if(confirmedItems.length){
    lines.push(`Confirmed the below — offer letter matches what the ${state.olMethod==='phone'?'HR rep confirmed on the call':'HR rep confirmed by email'}:`);
    confirmedItems.forEach(item=>lines.push(`✅ ${item}`));
  } else {
    lines.push('No details confirmed yet.');
  }
  if(state.olNotes.trim()){ lines.push(''); lines.push(`Notes: ${state.olNotes.trim()}`); }

  const text = lines.join('\n').trim();
  const done = ()=>{
    state.olCopyMsg='✓ Copied — paste this into the application guestcard.';
    render();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>{
      state.olCopyMsg='Could not copy automatically — please copy manually.';
      render();
    });
  } else {
    const ta=document.createElement('textarea');
    ta.value=text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }
    catch(e){ state.olCopyMsg='Could not copy automatically — please copy manually.'; render(); }
    document.body.removeChild(ta);
  }
}

function csSet(k,v){
  csState[k]=v;
  if(k==='tpl'||k==='community'){ csState.msg=null; }
  if(k==='community'){
    // A locally uploaded file belongs to the community it was added under,
    // so drop it when moving to a different one rather than carrying it over.
    if(csState.photo && csState.photo.indexOf('data:') === 0) csState.photo = '';
    csAutoPhoto();
  }
  csState.note='';
  render();
}
function csPickSaved(i){ csState.photo = csList()[i] || ''; render(); }

function csUploadLocal(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){
    csState.photo = r.result;
    csState.note = 'Using a local file. It previews and downloads fine, but it is not saved — add it to the GitHub repo to keep it.';
    render();
  };
  r.readAsDataURL(f);
}

async function csAddPhoto(){
  const url = prompt('Paste the photo URL for ' + csState.community + '.\n\nUpload the image to community-photos/' + csSlug(csState.community) + '/ in your PEC-Hub GitHub repo, open the file, click Raw, and copy that address.');
  if(!url || !url.trim()) return;
  const slug = csSlug(csState.community);
  if(!csPhotos[slug]) csPhotos[slug] = [];
  csPhotos[slug].push(url.trim());
  csState.photo = url.trim();
  csState.note = '';
  render();
  const saved = await saveToFirestore('card_photos', {map: csPhotos});
  if(!saved) flagSaveFailed('Welcome card photo');
  else if(state.syncError) clearSyncIssue();
}

async function csRemoveSaved(i){
  const slug = csSlug(csState.community);
  const list = csPhotos[slug] || [];
  const url = list[i];
  if(!url) return;
  if(!confirm('Remove this photo from the list? The file itself stays in GitHub.')) return;
  csPhotos[slug] = list.filter(function(u,idx){ return idx!==i; });
  if(csState.photo===url) csState.photo='';
  render();
  const saved = await saveToFirestore('card_photos', {map: csPhotos});
  if(!saved) flagSaveFailed('Welcome card photo');
}

async function csDownload(){
  if(!document.getElementById('csCard')) return;
  csState.busy = true; csState.note=''; render();
  const wrap = document.getElementById('csScale');
  const prev = wrap ? wrap.style.transform : '';
  if(wrap) wrap.style.transform = 'none';
  try{
    if(document.fonts && document.fonts.ready) await document.fonts.ready;
    const canvas = await html2canvas(document.getElementById('csCard'), {
      backgroundColor:null, scale:1, useCORS:true, logging:false
    });
    const a = document.createElement('a');
    a.download = 'Avanti_' + csState.tpl + '_' + csState.community.replace(/[^A-Za-z0-9]+/g,'-') + '.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    csState.note = 'Saved to your downloads.';
  }catch(err){
    console.error('Card export failed:', err);
    csState.note = 'Export failed. If the photo came from a site other than GitHub, that site is blocking the export — put the image in the PEC-Hub repo instead.';
  }finally{
    const w = document.getElementById('csScale');
    if(w) w.style.transform = prev;
    csState.busy = false; render();
  }
}

    + '<div class="filters">'+chip('tpl','welcome','Welcome')+chip('tpl','hello','Hello')+chip('tpl','confirmed','Tour confirmed')+chip('tpl','approved','Approved / Future Resident')+'</div>'

    + '<label class="eod-label" style="margin-top:10px">Photo side</label>'
    + '<div class="filters">'+chip('side','right','Right')+chip('side','left','Left')+'</div>'

    + '<div class="eod-grid" style="margin-top:10px">'
    + '<div><label class="eod-label">Prospect first name (optional)</label>'
    + '<input type="text" class="eod-input" style="margin-bottom:0" placeholder="Jordan" value="'+csAttr(csState.prospect)+'" oninput="csState.prospect=this.value;csState.msg=null;csTouch()"/></div>'
    + (csState.tpl==='confirmed'
        ? '<div><label class="eod-label">Tour date and time</label>'
          + '<input type="text" class="eod-input" style="margin-bottom:0" placeholder="Thursday, Aug 7 at 2:00 PM" value="'+csAttr(csState.when)+'" oninput="csState.when=this.value;csTouch()"/></div>'
        : '')
    + '</div>'

    + '<label class="eod-label" style="margin-top:14px">Message</label>'
    + '<textarea id="csMsgBox" class="eod-textarea" style="margin-bottom:6px" oninput="csState.msg=this.value;csTouch()">'+csEsc(csMsg())+'</textarea>'
    + '<button onclick="csState.msg=null;render()" style="font-size:11px;color:#64748b;background:none;border:none;cursor:pointer;padding:0;text-decoration:underline">Reset to the default wording</button>'
    + '</div>'

    + '<div style="background:#fff;border:1.5px solid #e2e8f0;border-radius:14px;padding:16px;margin-bottom:14px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<div style="font-size:12.5px;font-weight:800;color:#0f172a">Photos for '+csEsc(csState.community)+'</div>'
    + '<button onclick="csAddPhoto()" style="font-size:11px;font-weight:700;color:#fff;background:#0d9488;border:none;border-radius:8px;padding:6px 12px;cursor:pointer">+ Add photo URL</button>'
    + '</div>'
    + (saved.length
        ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + saved.map(function(u,i){
            return '<div style="position:relative">'
              + '<img src="'+csAttr(u)+'" onclick="csPickSaved('+i+')" style="width:110px;height:74px;object-fit:cover;border-radius:8px;cursor:pointer;border:2.5px solid '+(csState.photo===u?'#0d9488':'#e2e8f0')+'" onerror="this.style.opacity=\'.25\'"/>'
              + '<button onclick="csRemoveSaved('+i+')" style="position:absolute;top:3px;right:3px;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:50%;width:18px;height:18px;font-size:11px;line-height:1;cursor:pointer">×</button>'
              + '</div>';
          }).join('') + '</div>'
        : '<div style="font-size:12px;color:#64748b;line-height:1.6">No photos saved for this community yet. Upload one to <code>community-photos/'+csSlug(csState.community)+'/</code> in your PEC-Hub GitHub repo, copy its Raw link, then click Add photo URL.</div>')
    + '<div style="margin-top:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
    + '<label style="font-size:11px;font-weight:700;color:#475569;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:6px 12px;cursor:pointer">Try a local file<input type="file" accept="image/*" style="display:none" onchange="csUploadLocal(this)"/></label>'
    + '</div></div>'

    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
    + '<div class="section-label" style="margin:0">Preview <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#94a3b8">'+W+' × '+H+' px</span></div>'
    + '<button onclick="csDownload()"'+((csState.busy||!csState.photo)?' disabled':'')+' style="padding:8px 18px;background:'+((csState.busy||!csState.photo)?'#94a3b8':'#0d9488')+';color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:'+(csState.busy?'wait':(csState.photo?'pointer':'not-allowed'))+'">'+(csState.busy?'Rendering…':'Download PNG')+'</button>'
    + '</div>'
    + (csState.note ? '<div style="font-size:11.5px;color:#0f766e;background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:8px 12px;margin-bottom:10px">'+csEsc(csState.note)+'</div>' : '')

    + (csState.photo
        ? '<div style="width:'+Math.round(W*k)+'px;height:'+Math.round(H*k)+'px;max-width:100%;overflow:hidden;border-radius:12px;box-shadow:0 12px 34px -14px rgba(0,0,0,.45)">'
          + '<div id="csScale" style="transform-origin:top left;transform:scale('+k+')">'+csCardHtml()+'</div>'
          + '</div>'
        : '<div style="width:'+Math.round(W*k)+'px;height:'+Math.round(H*k)+'px;max-width:100%;border:2px dashed #cbd5e1;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#f8fafc">'
          + '<div><div style="font-size:28px;margin-bottom:8px">🖼️</div>'
          + '<div style="font-size:13px;font-weight:700;color:#475569;margin-bottom:4px">Pick a photo to build the card</div>'
          + '<div style="font-size:11.5px;color:#94a3b8;line-height:1.6;max-width:320px">Choose one of the saved photos above, add a new URL, or use Try a local file. Every card uses a real community photo.</div>'
          + '</div></div>')

    + '<div style="margin-top:14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px 16px;font-size:11.5px;color:#64748b;line-height:1.7">'
    + '<strong style="color:#0f172a">Build ' + CS_BUILD + '</strong> · every card uses a real community photo. Photos are served from the PEC-Hub GitHub repo because raw.githubusercontent.com allows the cross-origin read that PNG export needs.'
    + '</div>'

    + '</div>';
}

// ── RENDER ────────────────────────────────────────────────────────
function renderPage(){
  // Defense in depth: even if state.page somehow got set to a
  // guest-blocked tab (stale state, direct call, etc.), bounce back home.
  const blockedForGuest = ['applicants','communities'];
  if(state.isGuest && blockedForGuest.includes(state.page)){
    state.page = 'home';
  }
  let html='';
  switch(state.page){
    case 'home':      html=renderHome();break;
    case 'announcements': html=renderAnnouncements();break;
    case 'kb':        html=renderKB();break;
    case 'spiels':    html=renderSpiels();break;
    case 'notes':     html=renderCallNotes();break;
    case 'listening': html=renderCallListening();break;
    case 'scorecard': html=renderScorecard();break;
    case 'priorities': html=renderPriorities();break;
    case 'checklist': html=renderChecklist();break;
    case 'applicants': html=renderApplicantStatus();break;
    case 'communities': html=renderCommunitiesMap();break;
    case 'reports': html=renderReportBuilder();break;
    case 'eod':       html=renderEOD();break;
    case 'coaching':  html=state.manager?renderCoaching():renderLogin();break;
    case 'offerletter': html=state.manager?renderOfferLetter():renderLogin();break;
    case 'cards':     html=state.manager?renderCardStudio():renderLogin();break;
    default:          html=renderHome();
  }
  document.getElementById('pageContent').innerHTML=html;
  // Manage the live Leaflet map's lifecycle on every render, not just nav
  // clicks — this covers incidental re-renders too (e.g. Firestore hydration
  // finishing in the background while someone's browsing the map tab).
  if(state.page==='communities'){ initCmMap(); } else { destroyCmMap(); }
  if(state.page==='notes'){ initCallGuide(); }
}
function flagSyncIssue(message){
  state.syncError = message;
  renderSyncBanner();
}
function flagSaveFailed(label){
  flagSyncIssue(`Couldn't save "${label}" to the shared database. It's visible on your screen right now, but it will likely disappear if you refresh. Check your internet connection and try again — if it keeps happening, the Firebase project may need attention (security rules can expire after 30 days in test mode).`);
}
function clearSyncIssue(){
  state.syncError = null;
  renderSyncBanner();
}
function renderSyncBanner(){
  const el = document.getElementById('syncErrorBanner');
  if(!el) return;
  el.innerHTML = state.syncError ? `
    <div style="background:#fef2f2;border-bottom:1.5px solid #fecaca;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px">
      <div style="font-size:12px;color:#991b1b;line-height:1.5">⚠️ ${state.syncError}</div>
      <button onclick="clearSyncIssue()" style="flex-shrink:0;background:none;border:none;color:#991b1b;font-weight:700;cursor:pointer;font-size:14px">✕</button>
    </div>` : '';
}
function render(){renderNav();renderPage();renderSyncBanner();}

// Render immediately with baked-in defaults first so the page never looks blank,
// then quietly hydrate from Firestore and re-render once real data arrives.
// Restore a previously persisted manager login, if any, before the first render
const restoredManager = loadPersistedManagerSession();
if(restoredManager) state.manager = restoredManager;

// Set before the first render so a returning Guest never sees a flash
// of restricted tabs before the nav filters them out.
state.isGuest = getVisitorName() === 'Guest';

render();
hydrateFromFirestore().then(()=>render()).catch(err=>console.error('Hydrate failed:', err));

// Start the online-presence system once Firestore (db) is ready.
// If this is the visitor's first time, this will show the name picker.
startPresenceSystem();
</script>
